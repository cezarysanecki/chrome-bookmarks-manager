<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Błąd zakładki</title>
  <link rel="stylesheet" href="brand.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14171b;
      color: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: 24px;
    }

    .card {
      background: #22262b;
      border: 1px solid #555c63;
      border-radius: 12px;
      padding: 32px 36px;
      max-width: 580px;
      width: 100%;
    }

    .icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .icon.icon--url   { background: rgba(255,59,48,.12); color: #ff3b30; }
    .icon.icon--tags  { background: rgba(255,87,34,.12); color: #ff8a65; }
    .icon svg { width: 24px; height: 24px; }

    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }

    .subtitle { font-size: 13px; color: #9aa4b0; margin-bottom: 20px; line-height: 1.5; }

    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: #9aa4b0;
      margin-bottom: 6px;
    }

    .value-box {
      background: #14171b;
      border: 1px solid #555c63;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      word-break: break-all;
      margin-bottom: 16px;
    }
    .value-box.value-box--url  { color: #ff3b30; }
    .value-box.value-box--raw  { color: #eef1f5; }
    .value-box.value-box--warn { color: #ff8a65; }

    .hint {
      font-size: 12px;
      color: #9aa4b0;
      line-height: 1.6;
      margin-top: 4px;
    }
    .hint strong { color: #ff8a65; }

    .example {
      background: #14171b;
      border: 1px solid #555c63;
      border-left: 3px solid #5bc8ac;
      border-radius: 6px;
      padding: 8px 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: #5bc8ac;
      margin-top: 12px;
    }

    .repair-input {
      width: 100%;
      background: #14171b;
      border: 1px solid #555c63;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #eef1f5;
      margin-bottom: 10px;
      font-family: inherit;
      outline: none;
    }
    .repair-input:focus { border-color: #ff5722; }

    .repair-btn {
      background: #5bc8ac;
      color: #14171b;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }
    .repair-btn:hover:not(:disabled) { background: #eef1f5; }
    .repair-btn:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <div class="card" id="card"></div>

  <script src="error.js"></script>
</body>
</html>
